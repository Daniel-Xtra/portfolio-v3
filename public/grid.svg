<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/>
      <circle cx="0" cy="0" r="0.5" fill="rgba(255,255,255,0.1)"/>
      <circle cx="20" cy="0" r="0.5" fill="rgba(255,255,255,0.1)"/>
      <circle cx="0" cy="20" r="0.5" fill="rgba(255,255,255,0.1)"/>
      <circle cx="20" cy="20" r="0.5" fill="rgba(255,255,255,0.1)"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="100" height="100" fill="url(#grid)"/>
</svg> 